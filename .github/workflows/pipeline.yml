name: Ingest and transform

on:
  schedule:
    # Every hour on the 15th minute (avoids the top-of-hour rush on GitHub's
    # cron infrastructure, which improves punctuality noticeably).
    - cron: "15 * * * *"
  workflow_dispatch: {}  # Allow manual runs from the Actions tab.

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history not needed — shallow is faster.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch raw data
        working-directory: pipeline
        run: python fetch.py

      - name: Transform (bronze → silver → gold)
        working-directory: pipeline
        run: python transform.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # Include the run timestamp so the history is scannable.
          git commit -m "data: hourly update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
